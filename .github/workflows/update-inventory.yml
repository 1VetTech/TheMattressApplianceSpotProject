name: Update Website Inventory

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

  push:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - "inventory_automation/**"
      - "tests/**"
      - ".github/workflows/update-inventory.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inventory-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build inventory
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Generate inventory JSON
        env:
          PUBLIC_INVENTORY_CSV_URL: ${{ secrets.PUBLIC_INVENTORY_CSV_URL }}
          OUTPUT_JSON: site/inventory.json
        run: python main.py

      - name: Verify generated inventory
        run: |
          test -f site/inventory.json
          python -c "import json; data=json.load(open('site/inventory.json', encoding='utf-8')); print(f'Generated {data[\"product_count\"]} products')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish inventory
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
